name: Daily radar

on:
  schedule:
    # UTC 04:00 / 09:00 = 北京时间 12:00 / 17:00
    - cron: "0 4,9 * * *"
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "同时发布到 Cloudflare Pages（需配 secret）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional deps
        run: pip install jieba

      # ── 关键：把上一轮的历史捞回来 ──────────────────────
      # Actions 每次都是全新虚拟机，不捞回来 history.jsonl 每次都从零开始，
      # term_history 就永远只看得到当天的数据。
      - name: Restore history from gh-pages
        run: |
          set -x
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          mkdir -p out
          if git show origin/gh-pages:history.jsonl > out/history.jsonl 2>/dev/null; then
            echo "restored rounds: $(wc -l < out/history.jsonl)"
          else
            echo "no history yet — starting fresh"
            : > out/history.jsonl
          fi

      - name: Fetch a round
        env:
          RADAR_HTTP_PROXY: ${{ secrets.RADAR_HTTP_PROXY }}
          LLM_BASE: ${{ secrets.LLM_BASE }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          python3 radar.py
          echo "history after fetch: $(wc -l < out/history.jsonl) rounds"

      - name: Publish to Cloudflare Pages
        if: github.event.inputs.publish_pages == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        run: |
          npm i -g wrangler
          python3 radar.py --publish

      # ── 把报告 + 历史一起提交回 gh-pages ────────────────
      - name: Commit report and history to gh-pages
        run: |
          set -e
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          ROUNDS=$(wc -l < out/history.jsonl | tr -d ' ')

          mkdir -p /tmp/site
          cp out/latest.html /tmp/site/index.html
          cp out/latest.md   /tmp/site/latest.md 2>/dev/null || true
          cp out/history.jsonl /tmp/site/history.jsonl
          LATEST=$(ls -d out/*/ 2>/dev/null | tail -1)
          if [ -n "$LATEST" ]; then
            cp "${LATEST}trends.json" /tmp/site/data.json 2>/dev/null || true
          fi
          printf '%s\n' "$STAMP" > /tmp/site/updated.txt
          printf '%s\n' "$ROUNDS" > /tmp/site/history-rounds.txt

          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages
          git rm -rf . --quiet 2>/dev/null || true
          cp -r /tmp/site/. .
          git add -A
          git commit -m "report: $STAMP · history: $ROUNDS rounds" || echo "no change"
          git push -f origin gh-pages
