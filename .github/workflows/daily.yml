name: Daily radar

on:
  schedule:
    # UTC 04:00 / 09:00 = 北京时间 12:00 / 17:00
    - cron: "0 4,9 * * *"
  workflow_dispatch:
    inputs:
      publish_pages:
        description: "同时发布到 Cloudflare Pages（需配 secret）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install optional deps
        run: pip install jieba

      - name: Fetch a round
        env:
          RADAR_HTTP_PROXY: ${{ secrets.RADAR_HTTP_PROXY }}
          LLM_BASE: ${{ secrets.LLM_BASE }}
          LLM_KEY: ${{ secrets.LLM_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python3 radar.py

      - name: Publish to Cloudflare Pages
        if: github.event.inputs.publish_pages == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
        run: |
          npm i -g wrangler
          python3 radar.py --publish

      - name: Commit report to gh-pages
        run: |
          set -e
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p /tmp/site
          cp out/latest.html /tmp/site/index.html
          cp out/latest.md   /tmp/site/latest.md 2>/dev/null || true
          LATEST=$(ls -d out/*/ 2>/dev/null | tail -1)
          [ -n "$LATEST" ] && cp "${LATEST}trends.json" /tmp/site/data.json 2>/dev/null || true
          echo "$STAMP" > /tmp/site/updated.txt

          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git checkout --orphan gh-pages 2>/dev/null || git checkout gh-pages
          git rm -rf . --quiet 2>/dev/null || true
          cp -r /tmp/site/. .
          git add -A
          git commit -m "report: $STAMP" || echo "no change"
          git push -f origin gh-pages
